services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-djnd-happy-farm-local
    restart: always
    environment:
      MYSQL_DATABASE: happy-farm
      MYSQL_ROOT_PASSWORD: 1607
    ports:
      - "3307:3306"
    volumes:
      - "./mysql_data:/var/lib/mysql"
  redis-happy-farm:
    image: redis:alpine
    container_name: redis_happy_farm_local
    restart: always
    ports:
      - "6379:6379"
